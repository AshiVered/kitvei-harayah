<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כתבי הראי״ה – האתר עבר לכתובת חדשה</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" href="https://aiv-dev.com/kitvei-harayah/assets/icon-64.png">
<!-- Shown at every address of the old site (as index.html and as 404.html), so it uses absolute links only. -->
<style>
@font-face { font-family: "Frank Ruhl Libre"; src: url("https://aiv-dev.com/kitvei-harayah/assets/FrankRuhlLibre.ttf") format("truetype"); font-weight: 300 900; font-display: swap; }
@font-face { font-family: "Heebo"; src: url("https://aiv-dev.com/kitvei-harayah/assets/Heebo.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
:root {
  --window: #16181D; --page: #202329; --border: #30343C; --ink: #E4DFD3; --muted: #959086;
  --accent: #D6B46A; --gold: #D6B46A; --on-gold: #1A1407; --shadow: 0 18px 50px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) {
  :root {
    --window: #EDEAE3; --page: #FFFDF8; --border: #D9D2C5; --ink: #2A241D; --muted: #7A6F62;
    --accent: #1F3A63; --gold: #B08B3A; --on-gold: #FFFFFF; --shadow: 0 18px 50px rgba(28,43,71,.18);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--window); color: var(--ink);
  font-family: "Segoe UI", "Heebo", system-ui, sans-serif; line-height: 1.6;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  width: 100%; max-width: 560px; text-align: center; background: var(--page);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 40px 32px 34px;
}
.card img { width: 96px; height: 96px; border-radius: 22px; }
.tag { margin: 18px 0 0; font-size: 13px; letter-spacing: .4px; color: var(--muted); }
h1 { font-family: "Frank Ruhl Libre", serif; font-weight: 800; font-size: 40px; line-height: 1.15; margin: 4px 0 0; color: var(--accent); }
.rule { width: 70px; height: 2px; background: var(--gold); margin: 18px auto 20px; }
p { margin: 0 0 6px; font-size: 17px; }
.new { display: inline-block; direction: ltr; margin-top: 6px; font-size: 15px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  padding: 12px 22px; border-radius: 6px; font-weight: 600; font-size: 16px; border: 1.5px solid var(--gold);
}
.btn.primary { background: var(--gold); color: var(--on-gold); }
.btn.secondary { color: var(--ink); }
.btn:hover { filter: brightness(1.06); }
.hint { margin-top: 22px; font-size: 13.5px; color: var(--muted); }
@media (max-width: 480px) { h1 { font-size: 32px; } .btn { width: 100%; justify-content: center; } }
</style>
</head>
<body>
  <main class="card">
    <img src="https://aiv-dev.com/kitvei-harayah/assets/icon.png" alt="">
    <p class="tag">כתבי הראי״ה</p>
    <h1>האתר עבר לכתובת חדשה</h1>
    <div class="rule"></div>
    <p>הספרייה, ההורדה והגרסה המקוונת נמצאות עכשיו בכתובת:</p>
    <a class="new" href="https://aiv-dev.com/kitvei-harayah/">aiv-dev.com/kitvei-harayah</a>
    <div class="actions">
      <a class="btn primary" href="https://aiv-dev.com/kitvei-harayah/">מעבר לאתר החדש</a>
      <a class="btn secondary" href="https://aiv-dev.com/kitvei-harayah/app/">פתיחת הגרסה המקוונת</a>
    </div>
    <p class="hint">אם שמרתם קישור או סימנייה לכתובת הישנה – כדאי לעדכן אותם.</p>
  </main>
</body>
</html>
