<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="כתבי הראי״ה – ספריית כתבי הרב אברהם יצחק הכהן קוק זצ״ל, עם חיפוש מלא">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="כתבי הראי״ה">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>כתבי הראי״ה</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Loading screen in the app's own colours, so there is no white flash while
       the app and its rendering engine download. Removed on Flutter's first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #16181D; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #16181D; color: #959086;
      font: 15px "Segoe UI", system-ui, sans-serif; transition: opacity .25s ease;
    }
    #loading img { width: 88px; height: 88px; border-radius: 20px; }
    #loading .bar { width: 160px; height: 3px; border-radius: 2px; background: #30343C; overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #D6B46A;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(260%); } to { transform: translateX(-160%); } }
    @media (prefers-color-scheme: light) {
      html, body, #loading { background: #EDEAE3; }
      #loading { color: #7A6F62; }
      #loading .bar { background: #D9D2C5; }
      #loading .bar::after { background: #B08B3A; }
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>טוען את כתבי הראי״ה…</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
