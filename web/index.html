  <!-- Loading screen in the app's own colours, so there is no white flash while
       the app and its rendering engine download. Removed on Flutter's first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #16181D; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #16181D; color: #959086;
      font: 15px "Segoe UI", system-ui, sans-serif; transition: opacity .25s ease;
    }
    #loading img { width: 88px; height: 88px; border-radius: 20px; }
    #loading .bar { width: 160px; height: 3px; border-radius: 2px; background: #30343C; overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #D6B46A;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(260%); } to { transform: translateX(-160%); } }
    @media (prefers-color-scheme: light) {
      html, body, #loading { background: #EDEAE3; }
      #loading { color: #7A6F62; }
      #loading .bar { background: #D9D2C5; }
      #loading .bar::after { background: #B08B3A; }
    }
  </style>
